    <script>window.__splashStart = Date.now();</script>

    <!-- Simulated main app content (shown after splash fades) -->
    <main style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:12px;">
        <h1 style="font-size:24px; font-weight:600;">✅ Main App Loaded</h1>
        <p style="color:#a1a1a6; font-size:14px;">The splash screen has completed and been removed.</p>
        <button onclick="location.reload()" style="margin-top:20px; padding:10px 24px; background:linear-gradient(135deg, #ff375f, #ff6482); border:none; border-radius:10px; color:#fff; font-size:14px; font-weight:600; cursor:pointer;">Replay Animation</button>
    </main>

    <script>
        // Simulate the app.js init() splash dismissal
        const splash = document.getElementById('splash-screen');
        if (splash) {
            const SPLASH_MIN_DURATION = 5000;
            const splashStart = window.__splashStart || Date.now();
            const elapsed = Date.now() - splashStart;
            const remaining = Math.max(0, SPLASH_MIN_DURATION - elapsed);
            setTimeout(() => {
                splash.classList.add('splash-exit');
                splash.addEventListener('transitionend', () => splash.remove(), { once: true });
                setTimeout(() => { if (splash.parentNode) splash.remove(); }, 800);
            }, remaining);
        }
    </script>
